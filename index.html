<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>RSInstaller</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #fff;
            color: #1a1a1a;
            font-family: Arial, Helvetica, sans-serif;
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            border-bottom: 1px solid #ddd;
        }
        .brand { font-weight: 700; }
        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 48px 24px 64px;
        }
        h1 {
            font-size: 32px;
            margin: 8px 0 12px;
        }
        .meta {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        p { line-height: 1.5; color: #333; }
        input {
            width: 100%;
            max-width: 380px;
            display: block;
            margin: 10px 0;
            padding: 10px 12px;
            border: 1px solid #ccc;
            background: #fff;
            font-size: 15px;
        }
        button {
            border: 0;
            background: #111;
            color: #fff;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #333; }
        .ghost {
            background: #fff;
            color: #111;
            border: 1px solid #111;
        }
        .ghost:hover { background: #f4f4f4; }
        .danger {
            background: #fff;
            color: #111;
            border: 1px solid #999;
            margin-left: 8px;
        }
        .row { display: flex; gap: 8px; align-items: center; }
        .row input { max-width: none; flex: 1; margin: 0; }
        .card {
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .error { color: #b42318; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

<div id="welcome" class="page active">
    <div class="top">
        <div class="brand">RSG Software</div>
    </div>
    <div class="wrap">
        <div class="meta">Installer · MSFS 2024</div>
        <h1>RSInstaller</h1>
        <p>Install RSG aircraft into your Community folder. Use the same account as on the website.</p>
        <button onclick="show('login')">Continue</button>
    </div>
</div>

<div id="login" class="page">
    <div class="top">
        <div class="brand">RSG Software</div>
    </div>
    <div class="wrap">
        <div class="meta">Account</div>
        <h1>Log in</h1>
        <p>Email and password from rsg-website.onrender.com</p>
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <p id="login-error" class="error"></p>
        <button onclick="login()">Log in</button>
    </div>
</div>

<div id="library" class="page">
    <div class="top">
        <div class="brand">RSG Software <span id="user-name" style="font-weight:400;color:#666"></span></div>
        <button class="ghost" onclick="logout()">Log out</button>
    </div>
    <div class="wrap">
        <div class="meta">Library</div>
        <h1>Your products</h1>

        <p class="meta">Community folder</p>
        <div class="row">
            <input id="folder">
            <button class="ghost" onclick="browse()">Browse</button>
        </div>

        <div id="products"></div>
    </div>
</div>

<script>
function show(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

async function login() {
    const result = await window.pywebview.api.login(
        document.getElementById('email').value,
        document.getElementById('password').value
    );
    if (!result.ok) {
        document.getElementById('login-error').innerText = result.error;
        return;
    }
    document.getElementById('user-name').innerText = result.name ? ' · ' + result.name : '';
    await loadLibrary();
    show('library');
}

async function logout() {
    await window.pywebview.api.logout();
    show('welcome');
}

async function browse() {
    const result = await window.pywebview.api.browse_folder();
    if (result.folder) document.getElementById('folder').value = result.folder;
    await loadLibrary();
}

async function loadLibrary() {
    const state = await window.pywebview.api.get_state();
    document.getElementById('folder').value = state.community_folder || '';
    document.getElementById('user-name').innerText = state.name ? ' · ' + state.name : '';

    const result = await window.pywebview.api.products();
    const root = document.getElementById('products');
    if (!result.ok) {
        root.innerHTML = '<p class="error">' + result.error + '</p>';
        return;
    }

    root.innerHTML = result.products.map(p => `
        <div class="card">
            <div>
                <strong>${p.name}</strong><br>
                <span class="meta">${p.simulator} · v${p.version} · ${p.owned ? (p.installed ? 'Installed' : 'Owned') : 'Not owned'}</span>
            </div>
            <div>
                ${p.owned ? `<button onclick='install(${JSON.stringify(p)})'>${p.installed ? 'Update' : 'Install'}</button>` : ''}
                ${p.installed ? `<button class="danger" onclick='uninstall(${JSON.stringify(p)})'>Uninstall</button>` : ''}
            </div>
        </div>
    `).join('');
}

async function install(product) {
    const result = await window.pywebview.api.install(product);
    alert(result.ok ? 'Installed' : result.error);
    await loadLibrary();
}

async function uninstall(product) {
    await window.pywebview.api.uninstall(product);
    await loadLibrary();
}

window.addEventListener('pywebviewready', async () => {
    const state = await window.pywebview.api.get_state();
    if (state.logged_in) {
        await loadLibrary();
        show('library');
    }
});
</script>
</body>
</html>
