<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSInstaller</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Segoe UI, Arial, sans-serif;
    background: #0e141b;
    color: #e8eef3;
}
.screen { display: none; height: 100vh; }
.screen.active { display: flex; }
.login { align-items: center; justify-content: center; }
.login-box { width: 380px; }
.eyebrow { color: #7d8b98; letter-spacing: 1.4px; font-size: 11px; }
h1 { margin: 8px 0 10px; font-size: 28px; font-weight: 650; }
.sub { color: #8b98a5; margin: 0 0 22px; }
input {
    width: 100%;
    padding: 11px 12px;
    margin: 6px 0;
    border: 1px solid #24303b;
    background: #151d26;
    color: #fff;
    border-radius: 4px;
}
button {
    background: #1bb7c7;
    color: #062026;
    border: 0;
    padding: 10px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
}
button.full { width: 100%; margin-top: 8px; }
button.ghost {
    background: transparent;
    color: #d5dee6;
    border: 1px solid #33404c;
}
.error { color: #ff8b82; min-height: 20px; }
.side {
    width: 228px;
    background: #0a1016;
    border-right: 1px solid #1c2731;
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
}
.logo { font-weight: 800; margin-bottom: 28px; }
.logo span { color: #1bb7c7; }
.side a {
    display: block;
    color: #9aabba;
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 4px;
}
.side a.active, .side a:hover { background: #15202a; color: #fff; }
.side a.admin-only { display: none; }
body.admin .side a.admin-only { display: block; }
.user { margin-top: auto; color: #7d8b98; font-size: 12px; padding: 10px 12px; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #1c2731;
}
.search { width: 260px; margin: 0; }
.content { padding: 22px 24px; overflow: auto; }
.page { display: none; }
.page.active { display: block; }
.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #151d26;
    border: 1px solid #22303b;
    border-left: 3px solid #1bb7c7;
    padding: 16px 18px;
    margin-bottom: 10px;
    border-radius: 6px;
}
.item h3 { margin: 0 0 4px; font-size: 16px; }
.meta { color: #8b98a5; font-size: 13px; }
.actions { display: flex; gap: 8px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panel { background: #151d26; border: 1px solid #22303b; padding: 16px; border-radius: 6px; }
</style>
</head>
<body>

<section id="login" class="screen active">
    <div class="login-box">
        <div class="eyebrow">RSG SOFTWARE</div>
        <h1>RSInstaller</h1>
        <p class="sub">Install aircraft and liveries into your Community folder.</p>
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <p id="login-error" class="error"></p>
        <button class="full" onclick="login()">Log in</button>
    </div>
</section>

<section id="app" class="screen">
    <aside class="side">
        <div class="logo">RS<span>Installer</span></div>
        <a id="nav-library" class="active" href="#" onclick="openPage('library');return false;">Aircraft</a>
        <a id="nav-liveries" href="#" onclick="openPage('liveries');return false;">Liveries</a>
        <a id="nav-admin" class="admin-only" href="#" onclick="openPage('admin');return false;">Admin</a>
        <a href="#" onclick="logout();return false;">Log out</a>
        <div class="user" id="user-name"></div>
    </aside>
    <div class="main">
        <div class="topbar">
            <div id="page-title">Aircraft</div>
            <input class="search" id="search" placeholder="Search" oninput="filterItems()">
        </div>
        <div class="content">
            <div id="library" class="page active">
                <div class="actions" style="margin-bottom:14px">
                    <input id="folder" placeholder="Community folder">
                    <button class="ghost" onclick="browse()">Browse</button>
                </div>
                <div id="products"></div>
            </div>
            <div id="liveries" class="page">
                <div id="livery-list"></div>
            </div>
            <div id="admin" class="page">
                <div class="grid">
                    <div class="panel">
                        <h3>Add aircraft</h3>
                        <input id="p-name" placeholder="Name">
                        <input id="p-version" placeholder="Version">
                        <input id="p-folder" placeholder="Folder name">
                        <input id="p-url" placeholder="Download URL">
                        <button onclick="addProduct()">Save aircraft</button>
                        <p id="p-error" class="error"></p>
                    </div>
                    <div class="panel">
                        <h3>Add livery</h3>
                        <input id="l-name" placeholder="Name">
                        <input id="l-aircraft" placeholder="Aircraft">
                        <input id="l-folder" placeholder="Folder name">
                        <input id="l-url" placeholder="Download URL">
                        <button onclick="addLivery()">Save livery</button>
                        <p id="l-error" class="error"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
function show(id) {
    document.getElementById('login').classList.toggle('active', id === 'login');
    document.getElementById('app').classList.toggle('active', id === 'app');
}
function applyAdmin(isAdmin) {
    document.body.classList.toggle('admin', isAdmin === true);
}
function openPage(id) {
    if (id === 'admin' && !document.body.classList.contains('admin')) return;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.side a').forEach(a => a.classList.remove('active'));
    const nav = document.getElementById('nav-' + id);
    if (nav) nav.classList.add('active');
    document.getElementById('page-title').innerText = id === 'library' ? 'Aircraft' : id === 'liveries' ? 'Liveries' : 'Admin';
    if (id === 'library') loadLibrary();
    if (id === 'liveries') loadLiveries();
}
async function login() {
    const box = document.getElementById('login-error');
    if (!window.pywebview || !window.pywebview.api) {
        box.innerText = 'App backend not ready.';
        return;
    }
    box.innerText = 'Signing in...';
    const result = await window.pywebview.api.login(
        document.getElementById('email').value,
        document.getElementById('password').value
    );
    if (!result.ok) { box.innerText = result.error; return; }
    applyAdmin(result.is_admin === true);
    document.getElementById('user-name').innerText = result.name || '';
    show('app');
    openPage('library');
}
async function logout() {
    await window.pywebview.api.logout();
    applyAdmin(false);
    show('login');
}
async function browse() {
    const result = await window.pywebview.api.browse_folder();
    if (result.folder) document.getElementById('folder').value = result.folder;
    loadLibrary();
}
function row(item) {
    return `<div class="item" data-name="${(item.name || '').toLowerCase()}">
        <div>
            <h3>${item.name}</h3>
            <div class="meta">${item.simulator || item.aircraft || ''} · ${item.version || ''} · ${item.owned ? (item.installed ? 'Installed' : 'Owned') : 'Not owned'}</div>
        </div>
        <div class="actions">
            ${item.owned ? `<button onclick='act("install", ${JSON.stringify(item)})'>${item.installed ? 'Update' : 'Install'}</button>` : ''}
            ${item.installed ? `<button class="ghost" onclick='act("uninstall", ${JSON.stringify(item)})'>Uninstall</button>` : ''}
        </div>
    </div>`;
}
function filterItems() {
    const q = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('.item').forEach(el => {
        el.style.display = el.dataset.name.includes(q) ? 'flex' : 'none';
    });
}
async function loadLibrary() {
    const state = await window.pywebview.api.get_state();
    document.getElementById('folder').value = state.community_folder || '';
    document.getElementById('user-name').innerText = state.name || '';
    applyAdmin(state.is_admin === true);
    const result = await window.pywebview.api.products();
    document.getElementById('products').innerHTML = result.ok ? result.products.map(row).join('') : `<p class="error">${result.error}</p>`;
}
async function loadLiveries() {
    const result = await window.pywebview.api.liveries();
    document.getElementById('livery-list').innerHTML = result.ok ? result.liveries.map(row).join('') : `<p class="error">${result.error}</p>`;
}
async function addProduct() {
    const result = await window.pywebview.api.add_product({
        name: document.getElementById('p-name').value,
        version: document.getElementById('p-version').value,
        folder_name: document.getElementById('p-folder').value,
        download_url: document.getElementById('p-url').value
    });
    document.getElementById('p-error').innerText = result.ok ? 'Saved.' : result.error;
}
async function addLivery() {
    const result = await window.pywebview.api.add_livery({
        name: document.getElementById('l-name').value,
        aircraft: document.getElementById('l-aircraft').value,
        folder_name: document.getElementById('l-folder').value,
        download_url: document.getElementById('l-url').value
    });
    document.getElementById('l-error').innerText = result.ok ? 'Saved.' : result.error;
}
async function act(kind, item) {
    const result = await window.pywebview.api[kind](item);
    if (!result.ok) alert(result.error);
    loadLibrary(); loadLiveries();
}
document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login').classList.contains('active')) login();
});
window.addEventListener('pywebviewready', async () => {
    const state = await window.pywebview.api.get_state();
    if (state.logged_in) {
        applyAdmin(state.is_admin === true);
        document.getElementById('user-name').innerText = state.name || '';
        show('app');
        openPage('library');
    }
});
</script>
</body>
</html>
