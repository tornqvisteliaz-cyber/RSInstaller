<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSInstaller</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #111; }
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }
.toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px; padding: 0 32px;
    background: #fff; border-bottom: 1px solid #ddd;
}
.brand { font-weight: 700; font-size: 18px; }
nav { display: flex; align-items: center; gap: 6px; }
nav a { color: #333; text-decoration: none; padding: 8px 12px; }
nav a.active { font-weight: 700; }
.admin-only { display: none !important; }
body.admin .admin-only { display: inline !important; }
.wrap { width: min(1100px, calc(100% - 48px)); margin: 0 auto; padding: 40px 0 80px; }
h1 { font-size: 34px; margin: 6px 0 14px; }
.meta { color: #666; }
input, textarea {
    width: 100%; margin: 8px 0; padding: 12px 14px;
    border: 1px solid #ccc; font: inherit;
}
button { background: #111; color: #fff; border: 0; padding: 11px 18px; cursor: pointer; }
.ghost { background: #fff; color: #111; border: 1px solid #111; }
.error { color: #b42318; }
.ok { color: #177245; }
.bar { display: flex; gap: 8px; margin: 20px 0 28px; }
.bar input { margin: 0; }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.card { border: 1px solid #ddd; cursor: pointer; background: #fff; }
.card img, .hero { width: 100%; height: 180px; object-fit: cover; background: #eee; display: block; }
.hero { height: 360px; margin: 18px 0; }
.pad { padding: 14px 16px 18px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.panel { border: 1px solid #ddd; padding: 22px; }
.page { display: none; }
.page.active { display: block; }
.list-row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #eee; }
@media (max-width: 800px) { .grid, .bar { display: block; } }
</style>
</head>
<body>
<section id="login" class="screen active">
    <div class="toolbar"><div class="brand">RSG Software</div></div>
    <div class="wrap">
        <div class="meta">RSInstaller</div>
        <h1>Log in</h1>
        <input id="email" placeholder="Email or admin username">
        <input id="password" type="password" placeholder="Password">
        <p id="login-error" class="error"></p>
        <button onclick="doLogin()">Log in</button>
    </div>
</section>

<section id="app" class="screen">
    <div class="toolbar">
        <div class="brand">RSG Software</div>
        <nav>
            <span class="meta" id="user-name"></span>
            <a id="nav-library" href="#" onclick="openPage('library');return false;">Aircraft</a>
            <a id="nav-liveries" href="#" onclick="openPage('liveries');return false;">Liveries</a>
            <a id="nav-admin" class="admin-only" href="#" onclick="openPage('admin');return false;">Admin</a>
            <a href="#" onclick="doLogout();return false;">Log out</a>
        </nav>
    </div>
    <div class="wrap">
        <div id="library" class="page active">
            <div class="meta">Catalog</div>
            <h1>Aircraft</h1>
            <div class="bar">
                <input id="folder" placeholder="Community folder">
                <button class="ghost" onclick="browse()">Browse</button>
            </div>
            <div id="products" class="catalog"></div>
        </div>

        <div id="detail" class="page">
            <button class="ghost" onclick="openPage('library')">Back</button>
            <img id="d-image" class="hero" alt="">
            <div class="meta" id="d-meta"></div>
            <h1 id="d-name"></h1>
            <p id="d-desc"></p>
            <p id="d-price" style="font-size:22px"></p>
            <button id="d-buy">Buy</button>
            <button class="ghost" id="d-install">Install</button>
        </div>

        <div id="liveries" class="page">
            <div class="meta">Catalog</div>
            <h1>Liveries</h1>
            <div id="livery-list" class="catalog"></div>
        </div>

        <div id="admin" class="page">
            <div class="meta">Admin</div>
            <h1>Manage catalog</h1>
            <div class="grid">
                <div class="panel">
                    <h3>Add aircraft</h3>
                    <input id="p-name" placeholder="Name">
                    <input id="p-version" placeholder="Version">
                    <input id="p-folder" placeholder="Folder name">
                    <input id="p-url" placeholder="Download URL">
                    <input id="p-image" placeholder="Image URL">
                    <input id="p-price" placeholder="Price">
                    <input id="p-buy" placeholder="Buy URL">
                    <textarea id="p-desc" placeholder="Description" rows="4"></textarea>
                    <button onclick="saveProduct()">Save aircraft</button>
                    <p id="p-msg"></p>
                    <div id="admin-products"></div>
                </div>
                <div class="panel">
                    <h3>Add livery</h3>
                    <input id="l-name" placeholder="Name">
                    <input id="l-aircraft" placeholder="Aircraft">
                    <input id="l-folder" placeholder="Folder name">
                    <input id="l-url" placeholder="Download URL">
                    <input id="l-image" placeholder="Image URL">
                    <button onclick="saveLivery()">Save livery</button>
                    <p id="l-msg"></p>
                    <div id="admin-liveries"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
const STORE = {};
function api() { return window.pywebview && window.pywebview.api; }
function show(id) {
    document.getElementById('login').classList.toggle('active', id === 'login');
    document.getElementById('app').classList.toggle('active', id === 'app');
}
function setAdmin(on) { document.body.classList.toggle('admin', on === true); }
function openPage(id) {
    if (id === 'admin' && !document.body.classList.contains('admin')) return;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    const nav = document.getElementById('nav-' + (id === 'detail' ? 'library' : id));
    if (nav) nav.classList.add('active');
    if (id === 'library') loadLibrary();
    if (id === 'liveries') loadLiveries();
    if (id === 'admin') loadAdmin();
}
async function doLogin() {
    const box = document.getElementById('login-error');
    if (!api()) { box.innerText = 'App backend not ready.'; return; }
    box.innerText = 'Signing in...';
    const result = await api().login(document.getElementById('email').value, document.getElementById('password').value);
    if (!result.ok) { box.innerText = result.error; return; }
    setAdmin(result.is_admin === true);
    document.getElementById('user-name').innerText = result.name || '';
    show('app');
    openPage('library');
}
async function doLogout() { await api().logout(); setAdmin(false); show('login'); }
async function browse() {
    const result = await api().browse_folder();
    if (result.folder) document.getElementById('folder').value = result.folder;
}
function card(item) {
    STORE[item.id] = item;
    return `<div class="card" onclick="openDetail('${item.id}')">
        <img src="${item.image_url || ''}" alt="">
        <div class="pad"><h3>${item.name}</h3><div class="meta">${item.simulator || item.aircraft || ''} ${item.price || ''}</div></div>
    </div>`;
}
function openDetail(id) {
    const item = STORE[id];
    if (!item) return;
    document.getElementById('d-image').src = item.image_url || '';
    document.getElementById('d-meta').innerText = `${item.simulator || item.aircraft || ''} ${item.version || ''}`;
    document.getElementById('d-name').innerText = item.name;
    document.getElementById('d-desc').innerText = item.description || 'No description yet.';
    document.getElementById('d-price').innerText = item.price || '';
    document.getElementById('d-buy').onclick = () => api().open_url(item.buy_url || 'https://rsg-website.onrender.com/aircraft/seabee');
    document.getElementById('d-install').innerText = item.owned ? (item.installed ? 'Update' : 'Install') : 'Buy to install';
    document.getElementById('d-install').onclick = async () => {
        if (!item.owned) return api().open_url(item.buy_url);
        const result = await api().install(item);
        alert(result.ok ? 'Installed' : result.error);
    };
    openPage('detail');
}
async function loadLibrary() {
    const state = await api().get_state();
    document.getElementById('folder').value = state.community_folder || '';
    document.getElementById('user-name').innerText = state.name || '';
    setAdmin(state.is_admin === true);
    const result = await api().products();
    document.getElementById('products').innerHTML = result.ok ? result.products.map(card).join('') : `<p class="error">${result.error}</p>`;
}
async function loadLiveries() {
    const result = await api().liveries();
    document.getElementById('livery-list').innerHTML = result.ok ? result.liveries.map(card).join('') : `<p class="error">${result.error}</p>`;
}
async function loadAdmin() {
    const products = await api().products();
    const liveries = await api().liveries();
    document.getElementById('admin-products').innerHTML = (products.products || []).map(p => `<div class="list-row"><span>${p.name}</span><span class="meta">${p.version}</span></div>`).join('');
    document.getElementById('admin-liveries').innerHTML = (liveries.liveries || []).map(p => `<div class="list-row"><span>${p.name}</span><span class="meta">${p.aircraft}</span></div>`).join('');
}
async function saveProduct() {
    const msg = document.getElementById('p-msg');
    const result = await api().add_product(
        document.getElementById('p-name').value,
        document.getElementById('p-version').value,
        document.getElementById('p-folder').value,
        document.getElementById('p-url').value,
        document.getElementById('p-image').value,
        document.getElementById('p-price').value,
        document.getElementById('p-buy').value,
        document.getElementById('p-desc').value
    );
    msg.className = result.ok ? 'ok' : 'error';
    msg.innerText = result.ok ? 'Aircraft saved.' : (result.error || 'Could not save');
    if (result.ok) loadAdmin();
}
async function saveLivery() {
    const msg = document.getElementById('l-msg');
    const result = await api().add_livery(
        document.getElementById('l-name').value,
        document.getElementById('l-aircraft').value,
        document.getElementById('l-folder').value,
        document.getElementById('l-url').value,
        document.getElementById('l-image').value
    );
    msg.className = result.ok ? 'ok' : 'error';
    msg.innerText = result.ok ? 'Livery saved.' : (result.error || 'Could not save');
    if (result.ok) loadAdmin();
}
window.addEventListener('pywebviewready', async () => {
    const state = await api().get_state();
    if (state.logged_in) {
        setAdmin(state.is_admin === true);
        document.getElementById('user-name').innerText = state.name || '';
        show('app');
        openPage('library');
    }
});
</script>
</body>
</html>
