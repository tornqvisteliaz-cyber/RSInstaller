<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSInstaller</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #111; color: #eee; }
.login, .app { display: none; height: 100vh; }
.login.active, .app.active { display: flex; }
.login { align-items: center; justify-content: center; }
.box { width: 360px; }
.box h1 { margin: 0 0 8px; font-size: 26px; font-weight: 600; }
.box p { color: #9a9a9a; margin: 0 0 20px; }
input, button {
    width: 100%; padding: 11px 12px; margin: 6px 0;
    border: 1px solid #333; background: #1a1a1a; color: #fff;
}
button { background: #fff; color: #111; border: 0; cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: #fff; border: 1px solid #444; width: auto; }
button.small { width: auto; padding: 8px 12px; }
.error { color: #ff7b72; min-height: 20px; }
.side { width: 220px; background: #171717; padding: 22px 16px; display: flex; flex-direction: column; }
.side strong { display: block; margin-bottom: 24px; }
.side a { color: #bbb; text-decoration: none; display: block; padding: 8px 10px; margin-bottom: 4px; }
.side a.active, .side a:hover { background: #222; color: #fff; }
.admin-only { display: none; }
body.admin .admin-only { display: block; }
.main { flex: 1; padding: 28px 32px; overflow: auto; }
.meta { color: #8d8d8d; font-size: 13px; }
.row { display: flex; gap: 8px; }
.row input { flex: 1; width: auto; }
.item {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid #2a2a2a; padding: 16px 0;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
h2 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
.page { display: none; }
.page.active { display: block; }
.user { margin-top: auto; color: #8d8d8d; font-size: 13px; }
</style>
</head>
<body>

<section id="login" class="login active">
    <div class="box">
        <div class="meta">RSG SOFTWARE</div>
        <h1>RSInstaller</h1>
        <p>Log in to install aircraft and liveries.</p>
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <p id="login-error" class="error"></p>
        <button onclick="login()">Log in</button>
    </div>
</section>

<section id="app" class="app">
    <aside class="side">
        <strong>RSInstaller</strong>
        <a id="nav-library" class="active" href="#" onclick="openPage('library');return false;">Aircraft</a>
        <a id="nav-liveries" href="#" onclick="openPage('liveries');return false;">Liveries</a>
        <a id="nav-admin" class="admin-only" href="#" onclick="openPage('admin');return false;">Admin</a>
        <a href="#" onclick="logout();return false;">Log out</a>
        <div class="user" id="user-name"></div>
    </aside>
    <main class="main">
        <div id="library" class="page active">
            <div class="meta">Library</div>
            <h2>Aircraft</h2>
            <div class="row">
                <input id="folder" placeholder="Community folder">
                <button class="ghost small" onclick="browse()">Browse</button>
            </div>
            <div id="products"></div>
        </div>
        <div id="liveries" class="page">
            <div class="meta">Library</div>
            <h2>Liveries</h2>
            <div id="livery-list"></div>
        </div>
        <div id="admin" class="page">
            <div class="meta">Admin</div>
            <h2>Add content</h2>
            <p class="meta">New aircraft and liveries show up in the library after you save.</p>
            <div class="grid">
                <div>
                    <p>Aircraft</p>
                    <input id="p-name" placeholder="Name">
                    <input id="p-version" placeholder="Version">
                    <input id="p-folder" placeholder="Folder name">
                    <input id="p-url" placeholder="Download URL">
                    <button class="small" onclick="addProduct()">Add aircraft</button>
                    <p id="p-error" class="error"></p>
                </div>
                <div>
                    <p>Livery</p>
                    <input id="l-name" placeholder="Name">
                    <input id="l-aircraft" placeholder="Aircraft">
                    <input id="l-folder" placeholder="Folder name">
                    <input id="l-url" placeholder="Download URL">
                    <button class="small" onclick="addLivery()">Add livery</button>
                    <p id="l-error" class="error"></p>
                </div>
            </div>
        </div>
    </main>
</section>

<script>
function show(id) {
    document.getElementById('login').classList.toggle('active', id === 'login');
    document.getElementById('app').classList.toggle('active', id === 'app');
}
function openPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.side a').forEach(a => a.classList.remove('active'));
    const nav = document.getElementById('nav-' + id);
    if (nav) nav.classList.add('active');
    if (id === 'library') loadLibrary();
    if (id === 'liveries') loadLiveries();
}
function applyAdmin(isAdmin) {
    document.body.classList.toggle('admin', !!isAdmin);
}
async function login() {
    const box = document.getElementById('login-error');
    if (!window.pywebview || !window.pywebview.api) {
        box.innerText = 'App backend not ready.';
        return;
    }
    box.innerText = 'Signing in...';
    const result = await window.pywebview.api.login(
        document.getElementById('email').value,
        document.getElementById('password').value
    );
    if (!result.ok) { box.innerText = result.error; return; }
    applyAdmin(result.is_admin);
    document.getElementById('user-name').innerText = result.name || '';
    show('app');
    openPage('library');
}
async function logout() {
    await window.pywebview.api.logout();
    applyAdmin(false);
    show('login');
}
async function browse() {
    const result = await window.pywebview.api.browse_folder();
    if (result.folder) document.getElementById('folder').value = result.folder;
    loadLibrary();
}
function row(item) {
    return `<div class="item">
        <div>
            <strong>${item.name}</strong>
            <div class="meta">${item.simulator || item.aircraft || ''} · ${item.owned ? (item.installed ? 'Installed' : 'Owned') : 'Not owned'}</div>
        </div>
        <div>
            ${item.owned ? `<button class="small" onclick='act("install", ${JSON.stringify(item)})'>${item.installed ? 'Update' : 'Install'}</button>` : ''}
            ${item.installed ? `<button class="ghost small" onclick='act("uninstall", ${JSON.stringify(item)})'>Remove</button>` : ''}
        </div>
    </div>`;
}
async function loadLibrary() {
    const state = await window.pywebview.api.get_state();
    document.getElementById('folder').value = state.community_folder || '';
    document.getElementById('user-name').innerText = state.name || '';
    applyAdmin(state.is_admin);
    const result = await window.pywebview.api.products();
    document.getElementById('products').innerHTML = result.ok ? result.products.map(row).join('') : `<p class="error">${result.error}</p>`;
}
async function loadLiveries() {
    const result = await window.pywebview.api.liveries();
    document.getElementById('livery-list').innerHTML = result.ok ? result.liveries.map(row).join('') : `<p class="error">${result.error}</p>`;
}
async function addProduct() {
    const result = await window.pywebview.api.add_product({
        name: document.getElementById('p-name').value,
        version: document.getElementById('p-version').value,
        folder_name: document.getElementById('p-folder').value,
        download_url: document.getElementById('p-url').value
    });
    document.getElementById('p-error').innerText = result.ok ? 'Saved.' : result.error;
    if (result.ok) loadLibrary();
}
async function addLivery() {
    const result = await window.pywebview.api.add_livery({
        name: document.getElementById('l-name').value,
        aircraft: document.getElementById('l-aircraft').value,
        folder_name: document.getElementById('l-folder').value,
        download_url: document.getElementById('l-url').value
    });
    document.getElementById('l-error').innerText = result.ok ? 'Saved.' : result.error;
    if (result.ok) loadLiveries();
}
async function act(kind, item) {
    const result = await window.pywebview.api[kind](item);
    if (!result.ok) alert(result.error);
    loadLibrary(); loadLiveries();
}
document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login').classList.contains('active')) login();
});
window.addEventListener('pywebviewready', async () => {
    const state = await window.pywebview.api.get_state();
    if (state.logged_in) {
        applyAdmin(state.is_admin);
        document.getElementById('user-name').innerText = state.name || '';
        show('app');
        openPage('library');
    }
});
</script>
</body>
</html>
