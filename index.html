<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RSInstaller</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Arial, sans-serif; background: #2a2d33; color: #e8eaed; }

.screen { display: none; height: 100vh; }
.screen.active { display: flex; }

/* LOGIN */
.login { align-items: center; justify-content: center; background: #1a1d21; }
.login-box { width: 340px; background: #2a2d33; padding: 20px; border: 1px solid #3a3d42; }
.login-box .brand { font-size: 10px; color: #8a8e95; text-transform: uppercase; letter-spacing: 1px; }
.login-box h1 { margin: 6px 0 24px; font-size: 20px; font-weight: bold; }
label { display: block; font-size: 11px; color: #8a8e95; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
input, textarea {
  width: 100%; margin: 0 0 16px; padding: 8px; border: 1px solid #3a3d42; 
  background: #1a1d21; color: #e8eaed; font: inherit; outline: 0;
}
input:focus { border-color: #5a5d62; }
button { 
  border: 1px solid #3a3d42; background: #3a3d42; color: #e8eaed; padding: 8px 12px;
  cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
}
button:hover { background: #4a4d52; border-color: #4a4d52; }
button:disabled { opacity: .5; cursor: default; }
.error { color: #f28482; margin-top: 10px; font-size: 11px; }
.ok { color: #81c995; margin-top: 10px; font-size: 11px; }

/* APP SHELL */
.app { flex-direction: column; }
.topbar { 
  height: 50px; display: flex; align-items: center; gap: 16px; 
  padding: 0 16px; background: #1a1d21; border-bottom: 1px solid #3a3d42;
}
.topbar .user { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.topbar .user .dot { width: 6px; height: 6px; border-radius: 50%; background: #5cb85c; }
.search { flex: 1; max-width: 300px; border-radius: 0; padding: 8px 10px; }
.topbar .right { display: flex; gap: 2px; }
.topbar .right button { border: 1px solid #3a3d42; background: #2a2d33; padding: 6px 8px; }
.topbar .right button:hover { background: #3a3d42; }

.shell { display: flex; flex: 1; min-height: 0; }
.sidebar { 
  width: 180px; flex: 0 0 180px; background: #2a2d33; 
  padding: 0; border-right: 1px solid #3a3d42; overflow-y: auto;
}
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 10px 12px; border: 0; border-left: 2px solid transparent;
  background: none; color: #8a8e95; font-size: 12px; font-weight: bold;
  cursor: pointer; text-transform: uppercase; letter-spacing: .3px;
}
.nav-item:hover { background: #3a3d42; color: #e8eaed; }
.nav-item.active { border-left-color: #e8eaed; background: #3a3d42; color: #e8eaed; }

.main { flex: 1; overflow: auto; background: #1a1d21; }
.pad { padding: 16px; }

.banner {
  height: 180px; margin: 0 0 16px 0; background: #2a2d33; 
  border-bottom: 1px solid #3a3d42; display: flex; align-items: center; justify-content: center;
  text-align: center;
}
.banner h1 { font-size: 28px; margin: 0; }

.section-title { padding: 12px 16px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: .5px; color: #8a8e95; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; padding: 0 16px 20px; }
.card { 
  position: relative; height: 140px; background: #2a2d33; border: 1px solid #3a3d42;
  cursor: pointer; overflow: hidden;
}
.card:hover { border-color: #5a5d62; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .overlay { position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,.7)); }
.card .info { position: absolute; left: 10px; right: 10px; bottom: 8px; }
.card .info h3 { margin: 0 0 2px; font-size: 12px; font-weight: bold; }
.card .info p { margin: 0; font-size: 10px; color: #8a8e95; }
.card .badge { 
  position: absolute; top: 6px; left: 6px; font-size: 9px; font-weight: bold; 
  padding: 2px 5px; background: rgba(0,0,0,.7); border: 1px solid #5a5d62;
}

/* DETAIL PAGE */
.page { display: none; }
.page.active { display: block; }
.hero { position: relative; height: 300px; border-bottom: 1px solid #3a3d42; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .overlay { position: absolute; inset: 0; background: linear-gradient(transparent, rgba(0,0,0,.9)); }
.hero h1 { position: absolute; bottom: 16px; left: 16px; font-size: 32px; margin: 0; }
.buybar { display: flex; gap: 8px; align-items: center; padding: 16px; background: #2a2d33; border-bottom: 1px solid #3a3d42; }
.price { font-size: 20px; margin-right: auto; font-weight: bold; }
.desc { max-width: 800px; padding: 16px; line-height: 1.5; font-size: 12px; color: #c8cccf; }
.form { max-width: 500px; padding: 16px; }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="screen active login">
  <div class="login-box">
    <div class="brand">RSG Software</div>
    <h1>RSInstaller</h1>
    <form id="login-form">
      <label>Username</label>
      <input id="username" required>
      <label>Password</label>
      <input id="password" type="password" required>
      <button type="submit" id="login-btn" style="width:100%; margin-top: 8px;">Log in</button>
    </form>
    <p id="l-msg"></p>
  </div>
</section>

<!-- APP -->
<section id="app" class="screen app">
  <div class="topbar">
    <div class="user"><span class="dot"></span><span id="user-name">Account</span></div>
    <input class="search" id="search" placeholder="Search..." type="text">
    <div class="right">
      <button id="refresh-btn">↻</button>
      <button id="logout-btn">↪</button>
    </div>
  </div>

  <div class="shell">
    <div class="sidebar">
      <button class="nav-item active" data-page="home">Home</button>
      <button class="nav-item" data-page="products">Products</button>
      <button class="nav-item" data-page="liveries">Liveries</button>
      <button class="nav-item hidden" id="admin-nav" data-page="admin">Admin</button>
    </div>

    <main class="main">
      <div id="page-home" class="page active">
        <div class="banner"><h1>RSInstaller</h1></div>
        <div class="section-title">Recent</div>
        <div class="grid" id="home-products"></div>
      </div>

      <div id="page-products" class="page">
        <div class="section-title">My Products</div>
        <div class="grid" id="products-grid"></div>
      </div>

      <div id="page-liveries" class="page">
        <div class="section-title">Livery Manager</div>
        <div class="grid" id="liveries-grid"></div>
      </div>

      <div id="page-admin" class="page">
        <div class="section-title">Admin Panel</div>
        <div class="form" id="admin-form-area"></div>
      </div>
    </main>
  </div>
</section>

<script>
const STORE = {};
let BACK = 'home';
function api() { return window.pywebview && window.pywebview.api; }

async function waitApi() {
  for (let i = 0; i < 30; i++) {
    if (api()) return true;
    await new Promise(r => setTimeout(r, 150));
  }
  return false;
}

function show(id) {
  document.getElementById('login').classList.toggle('active', id === 'login');
  document.getElementById('app').classList.toggle('active', id === 'app');
}

function openPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  BACK = name;
}

function setAdmin(isAdmin) {
  document.getElementById('admin-nav').classList.toggle('hidden', !isAdmin);
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => openPage(btn.dataset.page));
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('l-msg');
  const btn = document.getElementById('login-btn');
  msg.textContent = ''; msg.className = '';
  if (!await waitApi()) { msg.textContent = 'Bridge not ready.'; msg.className = 'error'; return; }
  btn.disabled = true; btn.textContent = 'LOGGING IN...';
  try {
    const r = await api().login(
      document.getElementById('username').value.trim(),
      document.getElementById('password').value
    );
    if (!r || r.ok === false) throw new Error((r && r.error) || 'Invalid credentials.');
    setAdmin(r.is_admin === true);
    document.getElementById('user-name').innerText = r.name || 'Account';
    show('app'); openPage('home');
  } catch (err) {
    msg.textContent = err.message; msg.className = 'error';
  } finally {
    btn.disabled = false; btn.textContent = 'LOG IN';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  try { await api().logout(); } finally {
    show('login');
    document.getElementById('login-form').reset();
  }
});

document.getElementById('refresh-btn').addEventListener('click', () => location.reload());

window.addEventListener('pywebviewready', async () => {
  const state = await api().get_state();
  if (state.logged_in) {
    setAdmin(state.is_admin === true);
    document.getElementById('user-name').innerText = state.name || 'Account';
    show('app'); openPage('home');
  }
});
</script>
</body>
</html>
