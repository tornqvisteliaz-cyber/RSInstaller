name: Build RSInstaller

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview requests pyinstaller
      - run: python -m PyInstaller --onefile --noconsole --name RSInstaller --add-data "index.html;." --collect-all webview app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RSInstaller
          path: dist/RSInstaller.exe