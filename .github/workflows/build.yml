name: Build RSInstaller

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter requests pyinstaller

      - name: Build exe
        run: |
          python -m PyInstaller --onefile --noconsole --name RSInstaller app.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: RSInstaller
          path: dist/RSInstaller.exe