name: Build RSInstaller

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter requests pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --name RSInstaller app.py

      - name: Build setup wizard
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RSInstallerSetup
          path: Output/RSInstallerSetup.exe